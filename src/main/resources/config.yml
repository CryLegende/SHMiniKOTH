zone:
  pos1: spawn,-17.698222597119873,71.50374533165873,32.19653921740691
  pos2: spawn,-9.45997789683911,78.62912365274993,40.54349821766487
  pressure_plate: POLISHED_BLACKSTONE_PRESSURE_PLATE

features:
  lose_durability: false
  pvp: true
  lose_health: false

rewards:
  commands:
  - eco give %player% 100
  - sm %player% &7&o(Récompense de roi du spawn)
  - rc MiniKOTHdeco %player%
  interval: 60
  countdown_sound:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_HAT
    volume: 1.0 # Entre 0.0 et 1.0 (ou plus, mais 1.0 est généralement le max audible normal)
    pitch: 1.0 # Entre 0.5 et 2.0 (1.0 est la normale)
    # Le son sera joué pour les X dernières secondes. Si 3, alors à 3s, 2s, 1s.
    seconds_trigger: 3

messages:
  new_king: '&7&l« &e&lSH &8&l» &7&e%player% &7est le nouveau roi du spawn !'
  king_lost: '&7&l« &6&lSH &8&l» &7Vous n''êtes plus le roi du spawn, &6%player% &7vous
    a volé votre place !'

placeholder:
  default_king: Personne
  time_format: HH:mm:ss
  reward_countdown_format: mm:ss # Format pour %shminikoth_reward_countdown%
  default_reward_countdown: N/A # Valeur si pas de roi pour le countdown
